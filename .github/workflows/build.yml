# Kontrolný build pre vetvy mimo main (rovnaké kroky ako Vercel, bez databázy).
name: Build
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-build-secret-ci-build-secret-0123456789
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dostupnosť náhľadov z X (len informácia)
        continue-on-error: true
        run: |
          node -e "const id='2123086672028127264';const tk=((Number(id)/1e15)*Math.PI).toString(36).replace(/(0+|\.)/g,'');fetch('https://cdn.syndication.twimg.com/tweet-result?id='+id+'&lang=sk&token='+tk).then(async r=>{const j=await r.json().catch(()=>null);console.log('status',r.status,'user',j&&j.user&&j.user.screen_name,'text',j&&j.text,'media',j&&JSON.stringify((j.mediaDetails||[]).map(m=>[m.type,m.media_url_https])))})"
          curl -s -o /dev/null -w "pbs %{http_code} %{content_type}\n" "https://pbs.twimg.com/profile_images/1661201415899951105/azNjKOSH_bigger.jpg"
